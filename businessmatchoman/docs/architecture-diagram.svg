<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="frontendGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backendGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dataGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="externalGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadows -->
    <filter id="dropshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="80" fill="url(#headerGradient)" filter="url(#dropshadow)"/>
  <text x="600" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    BusinessMatchOman - Platform Architecture
  </text>
  
  <!-- Client Layer -->
  <g id="clientLayer">
    <rect x="50" y="120" width="280" height="200" rx="10" fill="url(#frontendGradient)" filter="url(#dropshadow)"/>
    <text x="190" y="145" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
      Presentation Layer
    </text>
    <text x="190" y="165" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">
      (Client-Side)
    </text>
    
    <!-- Frontend Components -->
    <rect x="70" y="180" width="240" height="25" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="190" y="197" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
      React 18 + TypeScript
    </text>
    
    <rect x="70" y="210" width="115" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="127" y="223" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Tailwind CSS
    </text>
    
    <rect x="195" y="210" width="115" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="252" y="223" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Shadcn/UI
    </text>
    
    <rect x="70" y="235" width="115" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="127" y="248" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      TanStack Query
    </text>
    
    <rect x="195" y="235" width="115" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="252" y="248" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Wouter Router
    </text>
    
    <rect x="70" y="260" width="115" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="127" y="273" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      React Hook Form
    </text>
    
    <rect x="195" y="260" width="115" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="252" y="273" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      i18next
    </text>
    
    <rect x="70" y="285" width="240" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="190" y="298" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Vite (Build Tool &amp; Dev Server)
    </text>
  </g>
  
  <!-- Business Logic Layer -->
  <g id="businessLayer">
    <rect x="460" y="120" width="280" height="200" rx="10" fill="url(#backendGradient)" filter="url(#dropshadow)"/>
    <text x="600" y="145" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
      Business Logic Layer
    </text>
    <text x="600" y="165" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">
      (Server-Side)
    </text>
    
    <!-- Backend Components -->
    <rect x="480" y="180" width="240" height="25" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="600" y="197" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
      Node.js + Express.js + TypeScript
    </text>
    
    <rect x="480" y="210" width="115" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="537" y="223" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      JWT Auth
    </text>
    
    <rect x="605" y="210" width="115" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="662" y="223" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      RESTful APIs
    </text>
    
    <rect x="480" y="235" width="115" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="537" y="248" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Drizzle ORM
    </text>
    
    <rect x="605" y="235" width="115" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="662" y="248" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Multer Upload
    </text>
    
    <rect x="480" y="260" width="115" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="537" y="273" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Rate Limiting
    </text>
    
    <rect x="605" y="260" width="115" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="662" y="273" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Security (Helmet)
    </text>
    
    <rect x="480" y="285" width="240" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="600" y="298" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Validation (Zod) &amp; Error Handling
    </text>
  </g>
  
  <!-- Data Layer -->
  <g id="dataLayer">
    <rect x="870" y="120" width="280" height="200" rx="10" fill="url(#dataGradient)" filter="url(#dropshadow)"/>
    <text x="1010" y="145" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
      Data Layer
    </text>
    <text x="1010" y="165" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">
