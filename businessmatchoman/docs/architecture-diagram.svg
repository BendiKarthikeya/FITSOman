    </text>
    
    <!-- Database Components -->
    <rect x="890" y="180" width="240" height="25" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="1010" y="197" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
