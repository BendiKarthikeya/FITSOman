    </text>
    
    <rect x="890" y="210" width="115" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="947" y="223" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Users &amp; Auth
    </text>
    
    <rect x="1015" y="210" width="115" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="1072" y="223" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Business Listings
    </text>
    
    <rect x="890" y="235" width="115" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="947" y="248" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      KYC Documents
    </text>
    
    <rect x="1015" y="235" width="115" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="1072" y="248" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Settings &amp; Config
    </text>
    
    <rect x="890" y="260" width="115" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="947" y="273" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Categories &amp; Tags
    </text>
    
    <rect x="1015" y="260" width="115" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="1072" y="273" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      File Storage
    </text>
    
    <rect x="890" y="285" width="240" height="20" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="1010" y="298" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Connection Pool &amp; Migrations
    </text>
  </g>
  
  <!-- External Services -->
  <g id="externalServices">
    <rect x="50" y="380" width="1100" height="120" rx="10" fill="url(#externalGradient)" filter="url(#dropshadow)"/>
    <text x="600" y="405" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
      External Services &amp; Integrations
    </text>
    
    <!-- External Service Components -->
    <rect x="80" y="425" width="180" height="60" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="170" y="445" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      Translation Services
    </text>
    <text x="170" y="460" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      HuggingFace API (Primary)
    </text>
    <text x="170" y="475" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Google Translate (Fallback)
    </text>
    
    <rect x="290" y="425" width="180" height="60" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="380" y="445" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      Email Services
    </text>
    <text x="380" y="460" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      SendGrid API
    </text>
    <text x="380" y="475" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Notifications &amp; 2FA
    </text>
    
    <rect x="500" y="425" width="180" height="60" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="590" y="445" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      Payment Processing
    </text>
    <text x="590" y="460" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Stripe API
    </text>
    <text x="590" y="475" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      (Configured)</text>
    
    <rect x="710" y="425" width="180" height="60" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="800" y="445" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      Image Services
    </text>
    <text x="800" y="460" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Sharp Processing
    </text>
    <text x="800" y="475" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Unsplash CDN</text>
    
    <rect x="920" y="425" width="180" height="60" rx="5" fill="rgba(255,255,255,0.2)"/>
    <text x="1010" y="445" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      Deployment
    </text>
    <text x="1010" y="460" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Replit Platform
    </text>
    <text x="1010" y="475" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Auto-SSL &amp; CDN</text>
  </g>
  
  <!-- User Types -->
  <g id="userTypes">
    <rect x="50" y="540" width="1100" height="100" rx="10" fill="#374151" filter="url(#dropshadow)"/>
    <text x="600" y="565" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
      User Types &amp; Access Levels
    </text>
    
    <rect x="90" y="580" width="200" height="45" rx="5" fill="#4b5563"/>
    <text x="190" y="598" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      Entrepreneurs
    </text>
    <text x="190" y="612" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Create &amp; manage listings
    </text>
    
    <rect x="310" y="580" width="200" height="45" rx="5" fill="#4b5563"/>
    <text x="410" y="598" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      Investors
    </text>
    <text x="410" y="612" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Browse &amp; filter opportunities
    </text>
    
    <rect x="530" y="580" width="200" height="45" rx="5" fill="#4b5563"/>
    <text x="630" y="598" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      Brokers
    </text>
    <text x="630" y="612" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Facilitate connections
    </text>
    
    <rect x="750" y="580" width="200" height="45" rx="5" fill="#4b5563"/>
    <text x="850" y="598" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      Administrators
    </text>
    <text x="850" y="612" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Platform management
    </text>
  </g>
  
  <!-- Security Features -->
  <g id="securityFeatures">
    <rect x="50" y="670" width="1100" height="80" rx="10" fill="#dc2626" filter="url(#dropshadow)"/>
    <text x="600" y="695" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
      Security &amp; Compliance Features
    </text>
    
    <rect x="80" y="710" width="150" height="25" rx="3" fill="rgba(255,255,255,0.2)"/>
    <text x="155" y="726" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      JWT Authentication
    </text>
    
    <rect x="250" y="710" width="150" height="25" rx="3" fill="rgba(255,255,255,0.2)"/>
    <text x="325" y="726" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Two-Factor Auth (2FA)
    </text>
    
    <rect x="420" y="710" width="150" height="25" rx="3" fill="rgba(255,255,255,0.2)"/>
    <text x="495" y="726" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Rate Limiting
    </text>
    
    <rect x="590" y="710" width="150" height="25" rx="3" fill="rgba(255,255,255,0.2)"/>
    <text x="665" y="726" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      CSRF Protection
    </text>
    
    <rect x="760" y="710" width="150" height="25" rx="3" fill="rgba(255,255,255,0.2)"/>
    <text x="835" y="726" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Data Validation
    </text>
    
    <rect x="930" y="710" width="150" height="25" rx="3" fill="rgba(255,255,255,0.2)"/>
    <text x="1005" y="726" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      KYC Verification
    </text>
  </g>
  
  <!-- Connection Arrows -->
  <!-- Frontend to Backend -->
  <line x1="330" y1="220" x2="460" y2="220" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="395" y="215" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="11">
    HTTP/REST
  </text>
  
  <!-- Backend to Database -->
  <line x1="740" y1="220" x2="870" y2="220" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="805" y="215" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="11">
    SQL/ORM
  </text>
  
  <!-- Backend to External Services -->
  <line x1="600" y1="320" x2="600" y2="380" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="615" y="350" fill="#64748b" font-family="Arial, sans-serif" font-size="11">
    API Calls
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Footer -->
  <text x="600" y="780" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="12">
    BusinessMatchOman - Three-Tier Architecture with Modern Web Technologies
  </text>
</svg>