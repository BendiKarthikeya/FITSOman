<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="120" viewBox="0 0 320 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient matching TEEJARTI style -->
    <radialGradient id="bgGradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#f5f3f0;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#8b9a8c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b7a6d;stop-opacity:1" />
    </radialGradient>
    
    <!-- Gold/bronze gradient for the symbol -->
    <linearGradient id="symbolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37" />
      <stop offset="50%" style="stop-color:#b8941f" />
      <stop offset="100%" style="stop-color:#8b7355" />
    </linearGradient>
    
    <!-- Text gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b7355" />
      <stop offset="100%" style="stop-color:#6b5d45" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="320" height="120" fill="url(#bgGradient)"/>
  
  <!-- Business Connection Symbol inspired by TEEJARTI bird style -->
  <g transform="translate(160, 25)">
    <!-- Connection Hub - central circle representing the platform -->
    <circle cx="0" cy="0" r="3" fill="none" stroke="url(#symbolGradient)" stroke-width="1.5"/>
    
    <!-- Business Branches - representing different businesses connecting -->
    <g stroke="url(#symbolGradient)" stroke-width="1.5" fill="none">
      <!-- Left branch (Business Owners) -->
      <path d="M -20 -8 L -8 -3 L 0 0"/>
      <path d="M -25 -10 L -20 -8"/>
      <path d="M -30 -12 L -25 -10"/>
      
      <!-- Right branch (Investors) -->
      <path d="M 20 -8 L 8 -3 L 0 0"/>
      <path d="M 25 -10 L 20 -8"/>
      <path d="M 30 -12 L 25 -10"/>
      
      <!-- Top branch (Growth/Success) -->
      <path d="M 0 -15 L 0 -3"/>
      <path d="M -3 -18 L 0 -15 L 3 -18"/>
      
      <!-- Bottom branches (Regional connections) -->
      <path d="M -12 8 L -4 3 L 0 0"/>
      <path d="M 12 8 L 4 3 L 0 0"/>
      
      <!-- Outer connection points -->
      <circle cx="-30" cy="-12" r="2" fill="url(#symbolGradient)"/>
      <circle cx="30" cy="-12" r="2" fill="url(#symbolGradient)"/>
      <circle cx="-12" cy="8" r="1.5" fill="url(#symbolGradient)"/>
      <circle cx="12" cy="8" r="1.5" fill="url(#symbolGradient)"/>
      <circle cx="0" cy="-18" r="1.5" fill="url(#symbolGradient)"/>
    </g>
  </g>
  
  <!-- BusinessMatch Text in TEEJARTI style -->
  <g transform="translate(160, 80)">
    <!-- Main text centered -->
    <text x="0" y="0" font-family="serif" font-weight="300" font-size="24" 
          fill="url(#textGradient)" text-anchor="middle" letter-spacing="4px">
      BUSINESSMATCH
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="18" font-family="serif" font-weight="200" font-size="10" 
          fill="url(#textGradient)" text-anchor="middle" letter-spacing="3px" opacity="0.8">
      OMAN
    </text>
  </g>
  
  <!-- Decorative elements matching TEEJARTI's minimalist style -->
  <g stroke="url(#symbolGradient)" stroke-width="0.5" fill="none" opacity="0.6">
    <!-- Subtle corner elements -->
    <line x1="20" y1="20" x2="30" y2="20"/>
    <line x1="20" y1="20" x2="20" y2="30"/>
    
    <line x1="300" y1="20" x2="290" y2="20"/>
    <line x1="300" y1="20" x2="300" y2="30"/>
    
    <line x1="20" y1="100" x2="30" y2="100"/>
    <line x1="20" y1="100" x2="20" y2="90"/>
    
    <line x1="300" y1="100" x2="290" y2="100"/>
    <line x1="300" y1="100" x2="300" y2="90"/>
  </g>
</svg>