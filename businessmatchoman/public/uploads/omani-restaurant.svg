<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#F5F5DC"/>
  
  <!-- Restaurant building -->
  <rect x="50" y="100" width="300" height="150" fill="#D2B48C"/>
  <polygon points="40,100 360,100 350,80 50,80" fill="#8B4513"/>
  
  <!-- Traditional Omani arches -->
  <path d="M 80 120 Q 100 100 120 120 L 120 200 L 80 200 Z" fill="#F4E4BC"/>
  <path d="M 140 120 Q 160 100 180 120 L 180 200 L 140 200 Z" fill="#F4E4BC"/>
  <path d="M 200 120 Q 220 100 240 120 L 240 200 L 200 200 Z" fill="#F4E4BC"/>
  <path d="M 260 120 Q 280 100 300 120 L 300 200 L 260 200 Z" fill="#F4E4BC"/>
  
  <!-- Doors -->
  <rect x="170" y="180" width="60" height="70" fill="#654321" rx="30"/>
  <circle cx="220" cy="215" r="3" fill="#FFD700"/>
  
  <!-- Traditional patterns -->
  <rect x="90" y="140" width="20" height="20" fill="#8B4513" opacity="0.3"/>
  <rect x="150" y="140" width="20" height="20" fill="#8B4513" opacity="0.3"/>
  <rect x="210" y="140" width="20" height="20" fill="#8B4513" opacity="0.3"/>
  <rect x="270" y="140" width="20" height="20" fill="#8B4513" opacity="0.3"/>
  
  <!-- Palm trees -->
  <g transform="translate(20,150)">
    <rect x="18" y="40" width="8" height="60" fill="#8B4513"/>
    <ellipse cx="22" cy="45" rx="20" ry="6" fill="#228B22" transform="rotate(-20 22 45)"/>
    <ellipse cx="22" cy="45" rx="20" ry="6" fill="#32CD32" transform="rotate(20 22 45)"/>
    <ellipse cx="22" cy="45" rx="20" ry="6" fill="#228B22" transform="rotate(0 22 45)"/>
  </g>
  
  <g transform="translate(360,160)">
    <rect x="18" y="40" width="8" height="50" fill="#8B4513"/>
    <ellipse cx="22" cy="45" rx="18" ry="5" fill="#228B22" transform="rotate(-15 22 45)"/>
    <ellipse cx="22" cy="45" rx="18" ry="5" fill="#32CD32" transform="rotate(25 22 45)"/>
    <ellipse cx="22" cy="45" rx="18" ry="5" fill="#228B22" transform="rotate(5 22 45)"/>
  </g>
  
  <!-- Traditional coffee pots -->
  <g transform="translate(120,220)">
    <ellipse cx="0" cy="0" rx="8" ry="12" fill="#CD853F"/>
    <rect x="-2" y="-15" width="4" height="8" fill="#CD853F"/>
    <path d="M -8,-5 Q -12,-8 -8,-12" stroke="#CD853F" stroke-width="2" fill="none"/>
  </g>
  
  <g transform="translate(280,220)">
    <ellipse cx="0" cy="0" rx="8" ry="12" fill="#CD853F"/>
    <rect x="-2" y="-15" width="4" height="8" fill="#CD853F"/>
    <path d="M -8,-5 Q -12,-8 -8,-12" stroke="#CD853F" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Sign -->
  <rect x="120" y="60" width="160" height="30" fill="rgba(139,69,19,0.9)" rx="5"/>
  <text x="200" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFD700" text-anchor="middle">Traditional Omani Restaurant</text>
  
  <!-- Traditional patterns on building -->
  <circle cx="100" cy="160" r="5" fill="#8B4513" opacity="0.4"/>
  <circle cx="160" cy="160" r="5" fill="#8B4513" opacity="0.4"/>
  <circle cx="220" cy="160" r="5" fill="#8B4513" opacity="0.4"/>
  <circle cx="280" cy="160" r="5" fill="#8B4513" opacity="0.4"/>
</svg>