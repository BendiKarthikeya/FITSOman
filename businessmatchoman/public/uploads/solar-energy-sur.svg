<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky and ground -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="200" fill="url(#skyGrad)"/>
  <rect y="200" width="400" height="100" fill="#F4E4BC"/>
  
  <!-- Solar panel arrays -->
  <g transform="translate(50,150)">
    <rect x="0" y="0" width="60" height="30" fill="#1E3A8A" stroke="#1F2937" stroke-width="1"/>
    <rect x="5" y="5" width="50" height="20" fill="#3B82F6"/>
    <!-- Grid lines -->
    <line x1="0" y1="10" x2="60" y2="10" stroke="#1F2937" stroke-width="0.5"/>
    <line x1="0" y1="20" x2="60" y2="20" stroke="#1F2937" stroke-width="0.5"/>
    <line x1="20" y1="0" x2="20" y2="30" stroke="#1F2937" stroke-width="0.5"/>
    <line x1="40" y1="0" x2="40" y2="30" stroke="#1F2937" stroke-width="0.5"/>
  </g>
  
  <g transform="translate(130,155)">
    <rect x="0" y="0" width="60" height="30" fill="#1E3A8A" stroke="#1F2937" stroke-width="1"/>
    <rect x="5" y="5" width="50" height="20" fill="#3B82F6"/>
    <line x1="0" y1="10" x2="60" y2="10" stroke="#1F2937" stroke-width="0.5"/>
    <line x1="0" y1="20" x2="60" y2="20" stroke="#1F2937" stroke-width="0.5"/>
    <line x1="20" y1="0" x2="20" y2="30" stroke="#1F2937" stroke-width="0.5"/>
    <line x1="40" y1="0" x2="40" y2="30" stroke="#1F2937" stroke-width="0.5"/>
  </g>
  
  <g transform="translate(210,160)">
    <rect x="0" y="0" width="60" height="30" fill="#1E3A8A" stroke="#1F2937" stroke-width="1"/>
    <rect x="5" y="5" width="50" height="20" fill="#3B82F6"/>
    <line x1="0" y1="10" x2="60" y2="10" stroke="#1F2937" stroke-width="0.5"/>
    <line x1="0" y1="20" x2="60" y2="20" stroke="#1F2937" stroke-width="0.5"/>
    <line x1="20" y1="0" x2="20" y2="30" stroke="#1F2937" stroke-width="0.5"/>
    <line x1="40" y1="0" x2="40" y2="30" stroke="#1F2937" stroke-width="0.5"/>
  </g>
  
  <g transform="translate(290,165)">
    <rect x="0" y="0" width="60" height="30" fill="#1E3A8A" stroke="#1F2937" stroke-width="1"/>
    <rect x="5" y="5" width="50" height="20" fill="#3B82F6"/>
    <line x1="0" y1="10" x2="60" y2="10" stroke="#1F2937" stroke-width="0.5"/>
    <line x1="0" y1="20" x2="60" y2="20" stroke="#1F2937" stroke-width="0.5"/>
    <line x1="20" y1="0" x2="20" y2="30" stroke="#1F2937" stroke-width="0.5"/>
    <line x1="40" y1="0" x2="40" y2="30" stroke="#1F2937" stroke-width="0.5"/>
  </g>
  
  <!-- Control building -->
  <rect x="320" y="220" width="60" height="40" fill="#D1D5DB"/>
  <rect x="325" y="225" width="50" height="30" fill="#F3F4F6"/>
  <rect x="340" y="235" width="8" height="12" fill="#374151"/>
  <rect x="350" y="230" width="6" height="6" fill="#3B82F6"/>
  
  <!-- Power lines -->
  <line x1="350" y1="220" x2="350" y2="200" stroke="#374151" stroke-width="2"/>
  <line x1="340" y1="200" x2="360" y2="200" stroke="#374151" stroke-width="2"/>
  
  <!-- Sun -->
  <circle cx="350" cy="60" r="30" fill="#FCD34D"/>
  <g transform="translate(350,60)">
    <line x1="-45" y1="0" x2="-35" y2="0" stroke="#FCD34D" stroke-width="3"/>
    <line x1="35" y1="0" x2="45" y2="0" stroke="#FCD34D" stroke-width="3"/>
    <line x1="0" y1="-45" x2="0" y2="-35" stroke="#FCD34D" stroke-width="3"/>
    <line x1="0" y1="35" x2="0" y2="45" stroke="#FCD34D" stroke-width="3"/>
    <line x1="-32" y1="-32" x2="-25" y2="-25" stroke="#FCD34D" stroke-width="3"/>
    <line x1="25" y1="25" x2="32" y2="32" stroke="#FCD34D" stroke-width="3"/>
    <line x1="32" y1="-32" x2="25" y2="-25" stroke="#FCD34D" stroke-width="3"/>
    <line x1="-25" y1="25" x2="-32" y2="32" stroke="#FCD34D" stroke-width="3"/>
  </g>
  
  <!-- Energy rays -->
  <path d="M 350 90 L 80 150 L 160 155 L 240 160 L 320 165" stroke="#FCD34D" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>
  
  <!-- Company sign -->
  <rect x="80" y="20" width="200" height="25" fill="rgba(30,58,138,0.9)" rx="3"/>
  <text x="180" y="37" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#F3F4F6" text-anchor="middle">Solar Energy Installation - Sur</text>
</svg>