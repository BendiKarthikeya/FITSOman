<?xml version="1.0" encoding="UTF-8"?>
<svg width="280" height="80" viewBox="0 0 280 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e4d72" />
      <stop offset="50%" style="stop-color:#d97706" />
      <stop offset="100%" style="stop-color:#2563eb" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e4d72" />
      <stop offset="70%" style="stop-color:#2563eb" />
    </linearGradient>
  </defs>
  
  <!-- Icon section -->
  <g transform="translate(10, 10)">
    <!-- Background circle -->
    <circle cx="30" cy="30" r="25" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Buildings and connection -->
    <g transform="translate(8, 8)">
      <!-- Left building (Business Owners) -->
      <rect x="2" y="20" width="14" height="22" fill="#1e4d72" rx="2"/>
      <rect x="4" y="24" width="3" height="3" fill="white"/>
      <rect x="9" y="24" width="3" height="3" fill="white"/>
      <rect x="4" y="30" width="3" height="3" fill="white"/>
      <rect x="9" y="30" width="3" height="3" fill="white"/>
      <rect x="4" y="36" width="3" height="3" fill="white"/>
      <rect x="9" y="36" width="3" height="3" fill="white"/>
      
      <!-- Right building (Investors) -->
      <rect x="30" y="18" width="16" height="24" fill="#2563eb" rx="2"/>
      <rect x="32" y="22" width="3" height="3" fill="white"/>
      <rect x="37" y="22" width="3" height="3" fill="white"/>
      <rect x="42" y="22" width="3" height="3" fill="white"/>
      <rect x="32" y="28" width="3" height="3" fill="white"/>
      <rect x="37" y="28" width="3" height="3" fill="white"/>
      <rect x="42" y="28" width="3" height="3" fill="white"/>
      <rect x="32" y="34" width="3" height="3" fill="white"/>
      <rect x="37" y="34" width="3" height="3" fill="white"/>
      <rect x="42" y="34" width="3" height="3" fill="white"/>
      
      <!-- Connection bridge -->
      <line x1="16" y1="30" x2="30" y2="30" stroke="url(#logoGradient)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="23" cy="30" r="4" fill="#d97706"/>
      <circle cx="23" cy="30" r="2" fill="white"/>
      
      <!-- Growth indicators -->
      <path d="M10 15 L10 10 M7 13 L10 10 L13 13" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M38 12 L38 7 M35 10 L38 7 L41 10" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  
  <!-- Text section -->
  <g transform="translate(85, 0)">
    <!-- Main title -->
    <text x="0" y="35" font-family="Inter, sans-serif" font-weight="800" font-size="24" fill="url(#textGradient)">Business</text>
    <text x="115" y="35" font-family="Inter, sans-serif" font-weight="800" font-size="24" fill="#2563eb">Match</text>
    
    <!-- Tagline -->
    <text x="0" y="55" font-family="Inter, sans-serif" font-weight="500" font-size="12" fill="#6b7280">CONNECTING BUSINESSES • OMAN & GCC</text>
    
    <!-- Decorative line -->
    <line x1="0" y1="62" x2="180" y2="62" stroke="url(#logoGradient)" stroke-width="2"/>
  </g>
  
  <!-- Arabic text -->
  <g transform="translate(85, 0)">
    <text x="190" y="35" font-family="Noto Kufi Arabic, sans-serif" font-weight="700" font-size="16" fill="#1e4d72" text-anchor="end">مطابقة الأعمال</text>
    <text x="190" y="50" font-family="Noto Kufi Arabic, sans-serif" font-weight="400" font-size="10" fill="#6b7280" text-anchor="end">عُمان ودول الخليج</text>
  </g>
</svg>