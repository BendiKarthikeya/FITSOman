<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Traditional Omani pattern -->
  <g transform="translate(20, 10)">
    <path d="M20 15 L30 5 L40 15 L35 25 L25 25 Z" fill="url(#goldGradient)" stroke="#B8860B" stroke-width="1"/>
    <circle cx="30" cy="15" r="3" fill="#1E3A8A"/>
    <path d="M25 20 L35 20 M27 17 L33 17 M29 14 L31 14" stroke="#1E3A8A" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Gear elements -->
  <g transform="translate(35, 25)">
    <circle cx="0" cy="0" r="8" fill="url(#blueGradient)"/>
    <circle cx="0" cy="0" r="4" fill="white"/>
    <g stroke="url(#blueGradient)" stroke-width="2" fill="url(#blueGradient)">
      <rect x="-2" y="-10" width="4" height="4"/>
      <rect x="-2" y="6" width="4" height="4"/>
      <rect x="-10" y="-2" width="4" height="4"/>
      <rect x="6" y="-2" width="4" height="4"/>
    </g>
  </g>
  
  <g transform="translate(50, 25)">
    <circle cx="0" cy="0" r="6" fill="url(#blueGradient)"/>
    <circle cx="0" cy="0" r="3" fill="white"/>
    <g stroke="url(#blueGradient)" stroke-width="1.5" fill="url(#blueGradient)">
      <rect x="-1.5" y="-8" width="3" height="3"/>
      <rect x="-1.5" y="5" width="3" height="3"/>
      <rect x="-8" y="-1.5" width="3" height="3"/>
      <rect x="5" y="-1.5" width="3" height="3"/>
    </g>
  </g>
  
  <!-- Handshake -->
  <g transform="translate(65, 40)">
    <!-- Left hand (navy) -->
    <path d="M0 0 L8 -5 L15 -3 L20 2 L18 8 L12 10 L8 8 L5 5 Z" fill="url(#blueGradient)"/>
    <!-- Right hand (gold) -->
    <path d="M20 2 L28 -3 L35 -1 L40 5 L38 11 L32 13 L28 11 L25 8 Z" fill="url(#goldGradient)"/>
    <!-- Fingers interlock -->
    <circle cx="20" cy="5" r="2" fill="url(#goldGradient)"/>
    <circle cx="18" cy="3" r="1.5" fill="url(#blueGradient)"/>
  </g>
  
  <!-- Text -->
  <g transform="translate(120, 30)">
    <text x="0" y="0" font-family="'Arial Black', Arial, sans-serif" font-size="22" font-weight="900" fill="#1E3A8A">
      BUSINESS MATCH
    </text>
    <text x="0" y="25" font-family="'Arial', sans-serif" font-size="16" font-weight="600" fill="url(#goldGradient)">
      OMAN
    </text>
  </g>
</svg>