<?xml version="1.0" encoding="UTF-8"?>
<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e4d72;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="connectGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e4d72" />
      <stop offset="50%" style="stop-color:#d97706" />
      <stop offset="100%" style="stop-color:#2563eb" />
    </linearGradient>
  </defs>
  
  <circle cx="30" cy="30" r="28" fill="url(#bgGradient)" stroke="#e5e7eb" stroke-width="1"/>
  
  <!-- Main connecting elements -->
  <g transform="translate(8, 8)">
    <!-- Left business building (Entrepreneur/Seller) -->
    <rect x="2" y="20" width="14" height="22" fill="#1e4d72" rx="2"/>
    <rect x="4" y="24" width="3" height="3" fill="white"/>
    <rect x="9" y="24" width="3" height="3" fill="white"/>
    <rect x="4" y="30" width="3" height="3" fill="white"/>
    <rect x="9" y="30" width="3" height="3" fill="white"/>
    <rect x="4" y="36" width="3" height="3" fill="white"/>
    <rect x="9" y="36" width="3" height="3" fill="white"/>
    
    <!-- Right business building (Investor/Buyer) -->
    <rect x="28" y="18" width="16" height="24" fill="#2563eb" rx="2"/>
    <rect x="30" y="22" width="3" height="3" fill="white"/>
    <rect x="35" y="22" width="3" height="3" fill="white"/>
    <rect x="40" y="22" width="3" height="3" fill="white"/>
    <rect x="30" y="28" width="3" height="3" fill="white"/>
    <rect x="35" y="28" width="3" height="3" fill="white"/>
    <rect x="40" y="28" width="3" height="3" fill="white"/>
    <rect x="30" y="34" width="3" height="3" fill="white"/>
    <rect x="35" y="34" width="3" height="3" fill="white"/>
    <rect x="40" y="34" width="3" height="3" fill="white"/>
    
    <!-- Connecting bridge with gradient -->
    <line x1="16" y1="30" x2="28" y2="30" stroke="url(#connectGradient)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="22" cy="30" r="4" fill="#d97706"/>
    <circle cx="22" cy="30" r="2" fill="white"/>
    
    <!-- Growth arrows -->
    <path d="M9 15 L9 10 M6 13 L9 10 L12 13" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 12 L36 7 M33 10 L36 7 L39 10" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Small connecting dots for network effect -->
    <circle cx="9" cy="18" r="1.5" fill="#d97706" opacity="0.6"/>
    <circle cx="36" cy="16" r="1.5" fill="#d97706" opacity="0.6"/>
  </g>
</svg>