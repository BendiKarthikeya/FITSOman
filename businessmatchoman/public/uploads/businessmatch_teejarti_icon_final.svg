<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold gradient for icon -->
    <linearGradient id="iconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6c881" />
      <stop offset="50%" style="stop-color:#d4af37" />
      <stop offset="100%" style="stop-color:#b8941f" />
    </linearGradient>
    
    <!-- Bird outline -->
    <linearGradient id="iconBirdOutline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a876" />
      <stop offset="100%" style="stop-color:#8b7355" />
    </linearGradient>
  </defs>
  
  <!-- TEEJARTI-style bird for icon -->
  <g transform="translate(32, 32) scale(0.8)">
    <!-- Bird body -->
    <path d="M -15 0 
             C -15 -8, -10 -15, 0 -18
             L 12 -20
             C 18 -22, 24 -20, 28 -15
             L 32 -8
             C 34 -5, 32 0, 28 2
             L 24 4
             C 20 6, 18 10, 16 15
             L 12 22
             C 10 26, 6 28, 0 28
             L -10 28
             C -15 28, -18 26, -18 22
             L -18 5
             C -18 2, -16 0, -15 0 Z"
          fill="none" 
          stroke="url(#iconBirdOutline)" 
          stroke-width="2"/>
    
    <!-- Bird beak -->
    <path d="M 32 -8 L 40 -12 L 38 -4 Z" 
          fill="none" 
          stroke="url(#iconBirdOutline)" 
          stroke-width="2"/>
    
    <!-- Bird eye -->
    <circle cx="24" cy="-12" r="2" fill="url(#iconGold)"/>
    
    <!-- Bird wing -->
    <path d="M -5 -5 
             C -2 -8, 4 -5, 8 0
             C 4 2, -2 0, -5 -2 Z"
          fill="none" 
          stroke="url(#iconBirdOutline)" 
          stroke-width="1.5"/>
          
    <!-- Bird legs -->
    <line x1="0" y1="28" x2="0" y2="35" stroke="url(#iconBirdOutline)" stroke-width="2"/>
    <line x1="-4" y1="35" x2="4" y2="35" stroke="url(#iconBirdOutline)" stroke-width="2"/>
  </g>
</svg>