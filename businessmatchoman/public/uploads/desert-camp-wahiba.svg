<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Desert background -->
  <defs>
    <linearGradient id="desertGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#F4A460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DEB887;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#desertGradient)"/>
  
  <!-- Sand dunes -->
  <path d="M 0 200 Q 100 150 200 180 Q 300 160 400 190 L 400 300 L 0 300 Z" fill="#F4E4BC"/>
  <path d="M 0 220 Q 80 190 160 210 Q 240 195 320 215 Q 360 208 400 220 L 400 300 L 0 300 Z" fill="#DEB887"/>
  
  <!-- Bedouin tents -->
  <g transform="translate(120,180)">
    <!-- Main tent -->
    <path d="M -30 20 Q 0 -10 30 20 L 25 40 L -25 40 Z" fill="#8B4513"/>
    <path d="M -25 20 Q 0 0 25 20 L 20 35 L -20 35 Z" fill="#D2B48C"/>
    <!-- Tent entrance -->
    <rect x="-8" y="20" width="16" height="20" fill="#654321"/>
    <!-- Tent poles -->
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#8B4513" stroke-width="2"/>
  </g>
  
  <g transform="translate(200,185)">
    <path d="M -25 15 Q 0 -8 25 15 L 20 35 L -20 35 Z" fill="#8B4513"/>
    <path d="M -20 15 Q 0 2 20 15 L 15 30 L -15 30 Z" fill="#D2B48C"/>
    <rect x="-6" y="15" width="12" height="20" fill="#654321"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#8B4513" stroke-width="2"/>
  </g>
  
  <g transform="translate(280,190)">
    <path d="M -20 10 Q 0 -5 20 10 L 18 30 L -18 30 Z" fill="#8B4513"/>
    <path d="M -18 10 Q 0 0 18 10 L 15 25 L -15 25 Z" fill="#D2B48C"/>
    <rect x="-5" y="10" width="10" height="20" fill="#654321"/>
  </g>
  
  <!-- Campfire area -->
  <g transform="translate(180,220)">
    <!-- Fire circle -->
    <circle cx="0" cy="0" r="15" fill="#8B4513" opacity="0.3"/>
    <!-- Logs -->
    <rect x="-12" y="-2" width="24" height="4" fill="#654321" rx="2"/>
    <rect x="-2" y="-12" width="4" height="24" fill="#654321" rx="2"/>
    <!-- Fire -->
    <polygon points="0,-8 -3,0 3,0" fill="#FF4500"/>
    <polygon points="0,-6 -2,2 2,2" fill="#FFD700"/>
  </g>
  
  <!-- Camel -->
  <g transform="translate(320,200)">
    <ellipse cx="0" cy="10" rx="25" ry="8" fill="#D2B48C"/>
    <rect x="-5" y="-5" width="8" height="20" fill="#D2B48C"/>
    <circle cx="0" cy="-8" r="6" fill="#D2B48C"/>
    <path d="M -15 5 L -20 15 M -10 8 L -15 18 M 10 8 L 15 18 M 15 5 L 20 15" stroke="#D2B48C" stroke-width="3"/>
  </g>
  
  <!-- Stars in sky -->
  <circle cx="50" cy="30" r="2" fill="#FFD700"/>
  <circle cx="100" cy="40" r="1.5" fill="#FFD700"/>
  <circle cx="150" cy="25" r="2" fill="#FFD700"/>
  <circle cx="200" cy="35" r="1.5" fill="#FFD700"/>
  <circle cx="250" cy="20" r="2" fill="#FFD700"/>
  <circle cx="300" cy="45" r="1.5" fill="#FFD700"/>
  <circle cx="350" cy="30" r="2" fill="#FFD700"/>
  
  <!-- Moon -->
  <circle cx="350" cy="60" r="20" fill="#F5F5DC" opacity="0.9"/>
  
  <!-- Sign -->
  <rect x="50" y="15" width="180" height="25" fill="rgba(139,69,19,0.9)" rx="3"/>
  <text x="140" y="32" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#F5F5DC" text-anchor="middle">Desert Tourism Camp - Wahiba Sands</text>
</svg>