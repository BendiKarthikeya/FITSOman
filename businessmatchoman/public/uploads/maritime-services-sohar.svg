<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Water and sky -->
  <defs>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4682B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B0E0E6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="150" fill="url(#skyGradient)"/>
  <rect y="150" width="400" height="150" fill="url(#waterGradient)"/>
  
  <!-- Port infrastructure -->
  <rect x="0" y="120" width="400" height="30" fill="#708090"/>
  
  <!-- Cranes -->
  <g transform="translate(50,50)">
    <rect x="0" y="50" width="8" height="70" fill="#2F4F4F"/>
    <rect x="-20" y="45" width="48" height="8" fill="#2F4F4F"/>
    <rect x="25" y="50" width="6" height="25" fill="#2F4F4F"/>
  </g>
  
  <g transform="translate(150,60)">
    <rect x="0" y="40" width="8" height="60" fill="#2F4F4F"/>
    <rect x="-25" y="35" width="55" height="8" fill="#2F4F4F"/>
    <rect x="27" y="40" width="6" height="20" fill="#2F4F4F"/>
  </g>
  
  <!-- Ships -->
  <g transform="translate(250,180)">
    <!-- Hull -->
    <ellipse cx="0" cy="0" rx="60" ry="15" fill="#696969"/>
    <!-- Superstructure -->
    <rect x="-30" y="-25" width="25" height="25" fill="#F5F5F5"/>
    <rect x="-10" y="-35" width="15" height="10" fill="#F5F5F5"/>
    <!-- Containers -->
    <rect x="10" y="-20" width="12" height="12" fill="#FF6347"/>
    <rect x="25" y="-20" width="12" height="12" fill="#32CD32"/>
    <rect x="40" y="-20" width="12" height="12" fill="#4169E1"/>
  </g>
  
  <g transform="translate(80,200)">
    <!-- Smaller vessel -->
    <ellipse cx="0" cy="0" rx="40" ry="10" fill="#483D8B"/>
    <rect x="-20" y="-15" width="15" height="15" fill="#F5F5F5"/>
    <rect x="-8" y="-20" width="8" height="8" fill="#F5F5F5"/>
  </g>
  
  <!-- Containers on dock -->
  <rect x="20" y="100" width="15" height="15" fill="#FF4500"/>
  <rect x="37" y="100" width="15" height="15" fill="#228B22"/>
  <rect x="54" y="100" width="15" height="15" fill="#4169E1"/>
  <rect x="71" y="100" width="15" height="15" fill="#FFD700"/>
  
  <!-- Company sign -->
  <rect x="120" y="20" width="160" height="25" fill="rgba(47,79,79,0.9)" rx="3"/>
  <text x="200" y="37" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#F5F5F5" text-anchor="middle">Maritime Services - Sohar Port</text>
  
  <!-- Water waves -->
  <path d="M 0 170 Q 50 165 100 170 T 200 170 T 300 170 T 400 170" stroke="#B0E0E6" stroke-width="2" fill="none"/>
  <path d="M 0 180 Q 30 175 60 180 T 120 180 T 180 180 T 240 180 T 300 180 T 400 180" stroke="#B0E0E6" stroke-width="2" fill="none"/>
</svg>