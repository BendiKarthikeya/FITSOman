<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold gradient matching TEEJARTI style -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6c881" />
      <stop offset="30%" style="stop-color:#d4af37" />
      <stop offset="70%" style="stop-color:#b8941f" />
      <stop offset="100%" style="stop-color:#9a7c17" />
    </linearGradient>
    
    <!-- Bird outline gradient -->
    <linearGradient id="birdOutline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a876" />
      <stop offset="100%" style="stop-color:#8b7355" />
    </linearGradient>
  </defs>
  
  <!-- TEEJARTI-style bird symbol -->
  <g transform="translate(30, 20)">
    <!-- Bird body and head outline -->
    <path d="M 5 40 
             C 5 35, 8 30, 15 28
             L 25 25
             C 30 23, 35 25, 38 30
             L 42 35
             C 44 38, 42 42, 38 43
             L 35 44
             C 32 45, 30 48, 28 52
             L 25 58
             C 23 62, 20 64, 15 64
             L 8 64
             C 5 64, 3 62, 3 58
             L 3 45
             C 3 42, 4 40, 5 40 Z"
          fill="none" 
          stroke="url(#birdOutline)" 
          stroke-width="2"/>
    
    <!-- Bird beak -->
    <path d="M 42 35 L 50 32 L 48 38 Z" 
          fill="none" 
          stroke="url(#birdOutline)" 
          stroke-width="2"/>
    
    <!-- Bird eye -->
    <circle cx="35" cy="32" r="2" fill="url(#goldGradient)"/>
    
    <!-- Bird wing details -->
    <path d="M 15 35 
             C 18 33, 22 35, 25 40
             C 22 42, 18 40, 15 38 Z"
          fill="none" 
          stroke="url(#birdOutline)" 
          stroke-width="1.5"/>
    
    <path d="M 12 42
             C 15 40, 19 42, 22 47
             C 19 49, 15 47, 12 45 Z"
          fill="none" 
          stroke="url(#birdOutline)" 
          stroke-width="1.5"/>
          
    <!-- Bird legs/feet -->
    <line x1="15" y1="64" x2="15" y2="70" stroke="url(#birdOutline)" stroke-width="2"/>
    <line x1="12" y1="70" x2="18" y2="70" stroke="url(#birdOutline)" stroke-width="2"/>
  </g>
  
  <!-- BUSINESSMATCH text in TEEJARTI style -->
  <g transform="translate(90, 45)">
    <text font-family="serif" 
          font-weight="300" 
          font-size="28" 
          fill="url(#goldGradient)" 
          letter-spacing="3px">BUSINESSMATCH</text>
  </g>
  
  <!-- Subtitle -->
  <g transform="translate(90, 75)">
    <text font-family="serif" 
          font-weight="200" 
          font-size="12" 
          fill="url(#goldGradient)" 
          letter-spacing="2px" 
          opacity="0.8">OMAN</text>
  </g>
</svg>